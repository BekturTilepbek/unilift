{% load i18n %}
<a href="{{ project.get_absolute_url }}" class="pcard">
  {% if project.cover %}
    <img src="{{ project.cover.url }}" alt="{{ project.title }}" class="pcard-img">
  {% else %}
    <div class="pcard-img pcard-img--empty"></div>
  {% endif %}
  <div class="pbody">
    {% if project.categories.all %}
      <div class="pcat">{{ project.categories.all|join:" · " }}</div>
    {% endif %}
    <h3>{{ project.title }}</h3>
    <p>{{ project.summary }}</p>
  </div>
</a>
